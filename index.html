<!DOCTYPE html>
<html
  <head>
  <title>Calculator - Harbart</title>
  <style>
    body { ... }
    .calc { ... }
    body.dark .theme-btn { ... }
  </style>
</head>
<body>
  dark .calc {background: #2d2d2d; color: white;}
body.dark input {background: #444; color: white;}
body.dark button {background: #333; color: white;}
body.dark .theme-btn {background: #555; color: white
</head>
</style>
</head>
<body>
  



<button id="theme-toggle" class="theme-btn">🌙 Dark Mode</button>
<div class="calc">

    <input type="text" id="display" readonly>
    <br>
    <button onclick="clearDisplay()">C</button>
    <button onclick="append('/')">/</button>
    <button onclick="append('*')">*</button>
    <button onclick="del()">DEL</button>
    <br>
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('-')">-</button>
    <br>
    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('+')">+</button>
    <br>
    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="equals" onclick="calculate()">=</button>
    <br>
    <button onclick="append('0')" style="width: 125px;">0</button>
    <button onclick="append('.')">.</button>
  </div>
  <script>
    let display = document.getElementById('display');
    function append(val) { display.value += val; }
    function clearDisplay() { display.value = ''; }
    function del() { display.value = display.value.slice(0, -1); }
    function calculate() { display.value = eval(display.value); }
  </script>
<script>
// Theme toggle
const toggleBtn = document.getElementById('theme-toggle');
const body = document.body;

// Load saved theme on refresh
if(localStorage.getItem('theme') === 'dark') {
  body.classList.add('dark');
  toggleBtn.textContent = '☀️ Light Mode';
}

// Switch theme on click
toggleBtn.onclick = () => {
  body.classList.toggle('dark');
  if(body.classList.contains('dark')) {
    toggleBtn.textContent = '☀️ Light Mode';
    localStorage.setItem('theme', 'dark');
  } else {
    toggleBtn.textContent = '🌙 Dark Mode';
    localStorage.setItem('theme', 'light');
  }
};
</script>
</body>
</html>
