<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harbart Tools v1.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap');

body {
  background: #000;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; margin: 0;
  font-family: 'Courier Prime', monospace;
}

.menu {
  background: #0a0a0a;
  border: 2px solid #00ff00;
  border-radius: 8px;
  padding: 30px;
  width: 320px;
  box-shadow: 0 0 30px #00ff00, inset 0 0 20px rgba(0,255,0,0.1);
  text-align: center;
}

h1 {
  color: #00ff00;
  font-size: 24px;
  margin: 0 0 10px 0;
  text-shadow: 0 0 15px #00ff00;
}

.subtitle {
  color: #00ff00;
  font-size: 12px;
  margin-bottom: 30px;
  opacity: 0.7;
}

.app-btn {
  width: 100%;
  height: 60px;
  background: #000;
  border: 2px solid #00ff00;
  color: #00ff00;
  font-family: 'Courier Prime', monospace;
  font-size: 18px;
  cursor: pointer;
  margin: 15px 0;
  transition: 0.2s;
  text-shadow: 0 0 10px #00ff00;
}

.app-btn:hover {
  background: #00ff00;
  color: #000;
  box-shadow: 0 0 20px #00ff00;
  transform: scale(1.05);
}

.desc {
  color: #00ff00;
  font-size: 11px;
  opacity: 0.6;
  margin-top: 5px;
}

@keyframes blink {
 50% { opacity: 0; }
}
.cursor {
  animation: blink 1s infinite;
}
</style>
</head>
<body>
<div class="menu">
  <h1>// HARBART TOOLS v1.0</h1>
  <div class="subtitle">Select application<span class="cursor">_</span></div>

  <button class="app-btn" onclick="window.location.href='Calc.html'">
    [1] CALCULATOR
    <div class="desc">€ Tracker + History</div>
  </button>

  <button class="app-btn" onclick="window.location.href='Passgen.html'">
    [2] PASSWORD GEN
    <div class="desc">Matrix Security</div>
  </button>
<button class="app-btn" onclick="window.location.href='Timer.html'">
[3] MATRIX TIMER
<div class="desc">Countdown + Alarm</div>
</button>
<button class="app-btn" onclick="window.location.href='Resume.html'">
[4] RESUME BUILDER
<div class="desc">PDF Resume + Print</div>
</button>
</div>
</body>
</html>
