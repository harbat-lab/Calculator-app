<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harbart Terminal Calc</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap');

* { box-sizing: border-box; }

body { 
  background: #000;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; margin: 0;
  font-family: 'Courier Prime', monospace;
}

.calc { 
  background: #0a0a0a;
  border: 2px solid #00ff00;
  border-radius: 8px;
  padding: 25px;
  width: 340px;
  box-shadow: 0 0 20px #00ff00, inset 0 0 20px rgba(0,255,0,0.1);
}

.toggle { 
  background: #000;
  border: 1px solid #00ff00;
  color: #00ff00;
  padding: 8px 15px;
  margin-bottom: 15px;
  cursor: pointer;
  font-family: 'Courier Prime', monospace;
}

#display { 
  width: 100%;
  height: 70px;
  background: #000;
  border: 2px solid #00ff00;
  color: #00ff00;
  font-family: 'Courier Prime', monospace;
  font-size: 32px;
  text-align: right;
  padding: 10px;
  margin-bottom: 15px;
  text-shadow: 0 0 10px #00ff00;
  outline: none;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

button { 
  height: 60px;
  background: #000;
  border: 1px solid #00ff00;
  color: #00ff00;
  font-family: 'Courier Prime', monospace;
  font-size: 20px;
  cursor: pointer;
  transition: 0.1s;
}

button:hover { 
  background: #00ff00;
  color: #000;
  box-shadow: 0 0 15px #00ff00;
}

button.equals { 
  background: #00ff00;
  color: #000;
  grid-row: span 2;
  height: 126px;
}

button.zero { 
  grid-column: span 2;
}

.history { 
  margin-top: 15px;
  padding: 10px;
  background: #000;
  border: 1px solid #00ff00;
  color: #00ff00;
  font-family: 'Courier Prime', monospace;
  font-size: 12px;
  height: 80px;
  overflow-y: auto;
}
</style>
</head>
<body>
<div class="calc">
  <button class="toggle" onclick="toggleTheme()">💻</button>
  <input type="text" id="display" readonly>
  
  <div class="buttons">
    <button onclick="clearDisplay()">C</button>
    <button onclick="deleteLast()">DEL</button>
    <button onclick="addToDisplay('/')">/</button>
    <button onclick="addToDisplay('*')">*</button>
    
    <button onclick="addToDisplay('7')">7</button>
    <button onclick="addToDisplay('8')">8</button>
    <button onclick="addToDisplay('9')">9</button>
    <button onclick="addToDisplay('-')">-</button>
    
    <button onclick="addToDisplay('4')">4</button>
    <button onclick="addToDisplay('5')">5</button>
    <button onclick="addToDisplay('6')">6</button>
    <button onclick="addToDisplay('+')">+</button>
    
    <button onclick="addToDisplay('1')">1</button>
    <button onclick="addToDisplay('2')">2</button>
    <button onclick="addToDisplay('3')">3</button>
    <button class="equals" onclick="calculate()">=</button>
    
    <button class="zero" onclick="addToDisplay('0')">0</button>
    <button onclick="addToDisplay('.')">.</button>
  </div>
  
  <div class="history" id="history">No calculations yet</div>
</div>

<script>
let display = document.getElementById('display');
let history = [];
let dark = true;

function addToDisplay(val) { 
  display.value += val; 
}

function clearDisplay() { 
  display.value = ''; 
}

function deleteLast() { 
  display.value = display.value.slice(0, -1); 
}

function calculate() {
  try {
    let result = eval(display.value);
    history.unshift(display.value + ' = ' + result);
    if(history.length > 5) history.pop();
    document.getElementById('history').innerHTML = history.join('<br>');
    display.value = result;
  } catch { 
    display.value = 'ERROR'; 
  }
}

function toggleTheme() {
  dark = !dark;
  document.body.style.background = dark ? '#000' : '#f0f0f0';
  document.querySelector('.toggle').textContent = dark ? '💻' : '🌙';
}
</script>
</body>
</html>
