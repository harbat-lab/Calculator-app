<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background: #f0f0f0;
  font-family: Arial;
}
.calc {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  width: 300px;
  padding: 20px;
  background: #222;
  border-radius: 10px;
}
input {
  grid-column: span 4;
  width: 100%;
  height: 60px;
  font-size: 24px;
  text-align: right;
  padding: 10px;
  border: none;
  border-radius: 5px;
  margin-bottom: 10px;
  box-sizing: border-box;
}
button {
  width: 100%;
  height: 60px;
  font-size: 20px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  background: #333;
  color: white;
}
button:hover { background: #444; }
</head>   
<body>.equals {
  grid-column: span 2;
  background: #238636;
.equals:hover { background: #2ea043; }

.history {
 margin-top: 20px;
   padding: 15px;
 background: #2a2a2a;
border-radius: 10px;
color: white;
 max-width: 400px;
 margin: 20px auto 0;
}
.history h3 { margin: 0 0 10px 0; font-size: 16px; }
 .history div { font-size: 14px; color: #aaa; line-height: 1.6; }
body.light .history { background: #e0e0e0; color: #333; }
</style>
</head>
<body>

<div class="calc">
 <button class="toggle" onclick="toggleTheme()">🌙</button>  
<input type="text" id="display" disabled>  
  
  
  <button onclick="clearDisplay()">C</button>
  <button onclick="del()">DEL</button>
  <button onclick="append('%')">%</button>
  <button onclick="append('/')">/</button>
  
  <button onclick="append('7')">7</button>
  <button onclick="append('8')">8</button>
  <button onclick="append('9')">9</button>
  <button onclick="append('*')">*</button>
  
  <button onclick="append('4')">4</button>
  <button onclick="append('5')">5</button>
  <button onclick="append('6')">6</button>
  <button onclick="append('-')">-</button>
  
  <button onclick="append('1')">1</button>
  <button onclick="append('2')">2</button>
  <button onclick="append('3')">3</button>
  <button onclick="append('+')">+</button>
  
  <button onclick="append('0')">0</button>
  <button onclick="append('.')">.</button>
  <button class="equals" onclick="calculate()">=</button>
 </div>
<div class="history">
 <h3>History</h3>
 <div id="historyList">No calculations yet</div>
 </div>
 <script>
let display = document.getElementById('display')
</div>
 function append(val) { display.value += val; }
 function del() { display.value = display.value.slice(0, -1); }
function calculate() {
  try {
   let calc = display.value;
   let result = eval(calc);
    addToHistory(calc, result);
   display.value = result;
  } catch {
    display.value = 'Error';
   }
 }
 function toggleTheme() {
 function del() { display.value = display.value.slice(0, -1); }
 function calculate() {                   
    display.value = result;
  } catch {
    display.value = 'Error';
  }
   
   function toggleTheme() {
  document.body.classList.toggle('light');
  let btn = document.querySelector('.toggle');
  btn.textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
 }
 
document.addEventListener('keydown', function(e) {
let key = e.key;
  
 if (key >= '0' && key <= '9' || ['+', '-', '*', '/', '.', '%'].includes(key)) {
   append(key);
  }
   else if (key === 'Enter' || key === '=') {
    calculate();
else if (key === 'Backspace') {
   del();
 }
  else if (key === 'Escape' || key.toLowerCase() === 'c') {
   clearDisplay();
});
let history = [];
function addToHistory(calc, result) {
  history.unshift(calc + ' = ' + result);
  if (history.length > 5) history.pop();
  
  let html = history.map(item => '<div>' + item + '</div>').join('');
  document.getElementById('historyList').innerHTML = html;
   }
</script>
</body>
</html>
