
<!DOCTYPE html>
<html>
<head>
<style>
body { background: #1a1a1a; color: white; font-family: Arial; }
.calc { max-width: 300px; margin: 50px auto; }
#display { width: 100%; height: 60px; font-size: 24px; text-align: right; margin: 10px 0; }
button { width: 70px; height: 50px; font-size: 18px; margin: 2px; }
.history { margin-top: 20px; padding: 10px; background: #2a2a2a; border-radius: 8px; }
</style>
</head>
<body>
<div class="calc">
  <button onclick="toggleTheme()">🌙</button>
  <input id="display" readonly>
  
  <button onclick="clearDisplay()">C</button>
  <button onclick="deleteLast()">DEL</button>
  <button onclick="addToDisplay('/')">/</button>
  <button onclick="addToDisplay('*')">*</button>
  
  <button onclick="addToDisplay('7')">7</button>
  <button onclick="addToDisplay('8')">8</button>
  <button onclick="addToDisplay('9')">9</button>
  <button onclick="addToDisplay('-')">-</button>
  
  <button onclick="addToDisplay('4')">4</button>
  <button onclick="addToDisplay('5')">5</button>
  <button onclick="addToDisplay('6')">6</button>
  <button onclick="addToDisplay('+')">+</button>
  
  <button onclick="addToDisplay('1')">1</button>
  <button onclick="addToDisplay('2')">2</button>
  <button onclick="addToDisplay('3')">3</button>
  <button onclick="calculate()" style="height:104px">=</button>
  
  <button onclick="addToDisplay('0')" style="width:144px">0</button>
  <button onclick="addToDisplay('.')">.</button>
  
  <div class="history" id="history">No calculations yet</div>
</div>

<script>
let display = document.getElementById('display');
let history = [];
let dark = true;

function addToDisplay(val) { display.value += val; }
function clearDisplay() { display.value = ''; }
function deleteLast() { display.value = display.value.slice(0, -1); }

function calculate() {
  try {
    let result = eval(display.value);
    history.unshift(display.value + ' = ' + result);
    if(history.length > 5) history.pop();
    document.getElementById('history').innerHTML = history.join('<br>');
    display.value = result;
  } catch { display.value = 'Error'; }
}

function toggleTheme() {
  dark = !dark;
  document.body.style.background = dark ? '#1a1a1a' : '#f0f0f0';
  document.body.style.color = dark ? 'white' : 'black';
}
</script>
</body>
</html>
